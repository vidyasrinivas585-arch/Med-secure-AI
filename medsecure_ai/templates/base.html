<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        MedSecure AI
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>

        :root {
            --blue: #1A73E8;
            --green: #0F9D58;
            --red: #D93025;
            --amber: #F59E0B;

            --text: #172033;
            --muted: #64748B;
            --surface: #F8FAFC;
            --border: #E2E8F0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
            color: var(--text);
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* =====================================================
           NAVBAR
           ===================================================== */

        .main-navbar {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 10px rgba(0,0,0,.04);
        }

        .navbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text);
            text-decoration: none;
        }

        .navbar-brand:hover {
            color: var(--blue);
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #E8F0FE;
            color: var(--blue);
            margin-right: 8px;
        }

        .nav-link {
            color: #475569 !important;
            font-weight: 500;
            padding-left: .8rem !important;
            padding-right: .8rem !important;
        }

        .nav-link:hover {
            color: var(--blue) !important;
        }

        .nav-link.active {
            color: var(--blue) !important;
            font-weight: 600;
        }

        /* =====================================================
           LANGUAGE SELECTOR
           ===================================================== */

        .language-selector {
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: .4rem .8rem;
            font-size: .85rem;
            background: #fff;
            cursor: pointer;
            min-width: 120px;
        }

        .language-selector:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 .15rem rgba(26,115,232,.12);
        }

        /* =====================================================
           CARDS
           ===================================================== */

        .ms-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 1rem;
            overflow: hidden;
        }

        .ms-card-header {
            padding: 1.1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: .65rem;
            border-bottom: 1px solid var(--border);
        }

        .ms-card-header h5 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
        }

        .ms-card-body {
            padding: 1.25rem;
        }

        .glass-card {
            background: rgba(255,255,255,.95);
            border: 1px solid var(--border);
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(15,23,42,.04);
        }

        /* =====================================================
           BUTTONS
           ===================================================== */

        .btn-primary {
            background: var(--blue);
            border-color: var(--blue);
        }

        .btn-primary:hover {
            background: #1557B0;
            border-color: #1557B0;
        }

        /* =====================================================
           SOFT BADGES
           ===================================================== */

        .bg-primary-soft {
            background: #E8F0FE !important;
        }

        .bg-success-soft {
            background: #ECFDF5 !important;
        }

        .bg-danger-soft {
            background: #FEF2F2 !important;
        }

        .bg-warning-soft {
            background: #FFFBEB !important;
        }

        .bg-secondary-soft {
            background: #F1F5F9 !important;
        }

        .text-primary {
            color: var(--blue) !important;
        }

        .text-success {
            color: var(--green) !important;
        }

        .text-danger {
            color: var(--red) !important;
        }

        /* =====================================================
           DROP ZONE
           ===================================================== */

        .drop-zone {
            border: 2px dashed #CBD5E1;
            background: #F8FAFC;
            cursor: pointer;
            transition: .2s ease;
        }

        .drop-zone:hover {
            border-color: var(--blue);
            background: #F8FBFF;
        }

        .drop-zone.dragover {
            border-color: var(--blue);
            background: #E8F0FE;
        }

        /* =====================================================
           HISTORY
           ===================================================== */

        .history-thumb {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .filter-pill {
            display: inline-flex;
            align-items: center;
            padding: .45rem .9rem;
            border-radius: 50px;
            text-decoration: none;
            background: #fff;
            border: 1px solid var(--border);
            color: #475569;
            font-size: .85rem;
            font-weight: 500;
        }

        .filter-pill:hover {
            color: var(--blue);
            border-color: var(--blue);
        }

        .filter-pill.active {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }

        .stat-card {
            padding: 1.25rem;
        }

        .stat-value {
            font-size: 1.7rem;
            font-weight: 800;
        }

        .stat-label {
            color: var(--muted);
            font-size: .82rem;
            margin-top: .25rem;
        }

        /* =====================================================
           PROCESSING OVERLAY
           ===================================================== */

        .processing-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,.82);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =====================================================
           FOOTER
           ===================================================== */

        .main-footer {
            background: #ffffff;
            border-top: 1px solid var(--border);
            padding: 1.5rem 0;
            margin-top: 3rem;
            color: var(--muted);
            font-size: .85rem;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 768px) {

            .navbar-nav {
                padding-top: .75rem;
            }

            .language-selector {
                margin-top: .5rem;
            }

        }

    </style>

    {% block head %}{% endblock %}

</head>

<body>

<!-- =========================================================
     NAVBAR
     ========================================================= -->

<nav class="navbar navbar-expand-lg main-navbar">

    <div class="container">

        <a class="navbar-brand"
           href="{{ url_for('index') }}">

            <span class="brand-icon">
                <i class="bi bi-shield-check"></i>
            </span>

            MedSecure AI

        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="mainNavbar">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('index') }}">

                        <i class="bi bi-house me-1"></i>
                        Home

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('upload') }}">

                        <i class="bi bi-shield-check me-1"></i>
                        Analyze

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('scan_qr_page') }}">

                        <i class="bi bi-qr-code me-1"></i>
                        QR Scanner

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('history') }}">

                        <i class="bi bi-clock-history me-1"></i>
                        History

                    </a>

                </li>

                <!-- LANGUAGE -->

                <li class="nav-item ms-lg-2">

                    <select
                        id="languageSelector"
                        class="language-selector"
                        onchange="changeLanguage(this.value)">

                        <option value="en">
                            English
                        </option>

                        <option value="kn">
                            ಕನ್ನಡ
                        </option>

                    </select>

                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main>

    {% block content %}
    {% endblock %}

</main>

<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer class="main-footer">

    <div class="container text-center">

        <div class="mb-1">

            <strong>
                MedSecure AI
            </strong>

        </div>

        <div>
            AI-powered medicine authenticity detection system
        </div>

    </div>

</footer>

<!-- =========================================================
     BOOTSTRAP JS
     ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- =========================================================
     I18N JS
     ========================================================= -->

<script
    src="{{ url_for('static', filename='js/i18n.js') }}">
</script>

<!-- =========================================================
     LANGUAGE INITIALIZATION
     ========================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const savedLanguage =
        localStorage.getItem("medsecure_language") || "en";

    const selector =
        document.getElementById("languageSelector");

    if (selector) {
        selector.value = savedLanguage;
    }

    /*
     * Do NOT call applyI18n("en").
     *
     * If Kannada was selected previously,
     * i18n.js will automatically translate the page.
     */

    if (
        savedLanguage === "kn" &&
        typeof applyI18n === "function"
    ) {

        setTimeout(function () {
            applyI18n("kn");
        }, 50);

    }

});

</script>

{% block scripts %}
{% endblock %}

</body>

</html>
